audio:
  fft_size: 512
  frame_shift_ms: 10
  frame_size_ms: 20
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  alpha_g: 0.7
  g_min_db: -20.0
  method: pmmse
  use_spp_weighting: true
name: PMMSE-V3-2-Aligned
noise_estimation:
  alpha: 0.95
  method: recursive_average
  num_init_frames: 20
  update_during_speech: false
noise_tracking:
  enable: true
snr_adaptive:
  base_g_min_db: -12.0
  clean_bypass: false
  clean_detection: true
  enable: true
  snr_smoothing: 0.9
spp:
  alpha_xi: 0.94
  q: 0.5
  xi_min_db: -25.0
version: 3-3-v3-2-aligned
