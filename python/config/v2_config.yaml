# V2: Wiener filter with decision-directed a-priori SNR and an SPP-gated MCRA noise update

version: "2.2"
name: "Wiener Filter with DD"

audio:
  sample_rate: 16000
  frame_size: 512
  hop_size: 256
  fft_size: 512
  window_type: hanning

noise_estimation:
  method: mcra
  alpha_s: 0.9                # 時間平滑因子
  alpha_d: 0.85               # 噪聲更新基礎速率
  alpha_p: 0.2                # SPP 平滑因子
  L: 96                       # 最小值窗口長度（約 1 秒 @ 10ms）
  delta_db: 5.0               # 偏差補償
  num_init_frames: 10         # 初始噪聲估計幀數

gain_calculation:
  method: wiener
  min_gain: 0.05              # 最小增益 (-26 dB)
  alpha_smooth: 0.5           # 增益平滑因子
  use_dd: true                # 啟用 Decision-Directed 方法
  alpha_dd: 0.98              # DD 平滑因子

noise_tracking:
  enable: true
