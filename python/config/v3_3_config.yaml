# V3-3: PMMSE (Perceptually Motivated MMSE)
#
# 增益計算: Wolfe & Godsill (2003) β=0.5 公式
#   G_PM = sqrt(v) / (sqrt(π) · γ) · 1 / i0e(v/2)
#   使用 scipy.special.i0e 避免數值溢出
#
# 噪聲估計方法: RecursiveAverage + Bayesian SPP 軟判決
#   - SppEstimator 計算語音存在機率
#   - 語音段自動降低噪聲更新速率
#
# Score: 0.5043 (Optuna 500-trial, 2026-01-12)

version: "3.3"
name: "PMMSE-Wolfe-Godsill"

audio:
  sample_rate: 16000
  frame_size: 512
  hop_size: 256
  fft_size: 512
  window_type: hanning

noise_estimation:
  method: mcra              # v2.2: 改用 MCRA 噪聲估計
  alpha_s: 0.8              # 時間平滑因子
  alpha_d: 0.95              # 噪聲更新基礎速率
  alpha_p: 0.2              # SPP 平滑因子
  L: 120                     # 最小值窗口長度
  delta_db: 5.0             # 偏差補償
  num_init_frames: 20       # 初始噪聲估計幀數

spp:
  alpha_xi: 0.90          # Optuna 500-trial (2026-01-12)
  q: 0.45                 # Optuna 500-trial (2026-01-12)
  xi_min_db: -19.0        # Optuna 500-trial (2026-01-12)

gain_calculation:
  method: pmmse               # Wolfe & Godsill β=0.5 公式
  g_min_db: -28.0             # Optuna 500-trial (2026-01-12); amplitude dB (/20) = old -14 @ /10
  alpha_g: 0.70               # Optuna 500-trial (2026-01-12)
  use_spp_weighting: true

noise_tracking:
  enable: true
