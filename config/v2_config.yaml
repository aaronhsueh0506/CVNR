audio:
  fft_size: 512
  frame_shift_ms: 10
  frame_size_ms: 20
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  alpha_smooth: 0.8
  method: wiener
  min_gain: 0.1
name: Wiener Filter
noise_estimation:
  alpha: 0.95
  method: recursive_average
  num_init_frames: 20
  update_during_speech: false
noise_tracking:
  enable: true
version: 2
