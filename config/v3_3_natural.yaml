version: 3-3-natural
name: PMMSE-Natural
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning
noise_estimation:
  method: recursive_average
  alpha: 0.95
  num_init_frames: 20
  update_during_speech: false
spp:
  alpha_xi: 0.92          # ✅ 0.98 → 0.92 (加快響應，減少延遲)
  q: 0.6                  # ✅ 0.5 → 0.6 (更保守的語音檢測)
  xi_min_db: -25.0
gain_calculation:
  method: pmmse
  g_min_db: -20.0         # 保持，由 SNR adaptive 動態調整
  alpha_g: 0.4            # ✅ 0.7 → 0.4 (關鍵！消除廣播感)
  use_spp_weighting: true
noise_tracking:
  enable: true
snr_adaptive:
  enable: true            # ✅ false → true (啟用 SNR 自適應)
  base_g_min_db: -10.0    # ✅ -15.0 → -10.0 (減少過度抑制)
  snr_smoothing: 0.9
  clean_detection: true
  clean_bypass: false
