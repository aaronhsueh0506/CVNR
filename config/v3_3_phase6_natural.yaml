version: 3-3-phase6-natural
name: PMMSE-Phase6-Natural
# Phase 6: 僅啟用快速啟動模式（Method A）
# 保守參數，適合追求自然度

audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning

noise_estimation:
  method: recursive_average
  alpha: 0.95
  num_init_frames: 20
  update_during_speech: false

spp:
  alpha_xi: 0.95
  q: 0.6
  xi_min_db: -25.0

gain_calculation:
  method: pmmse
  g_min_db: -20.0
  alpha_g: 0.5
  use_spp_weighting: true

noise_tracking:
  enable: true

snr_adaptive:
  enable: true
  base_g_min_db: -12.0
  snr_smoothing: 0.9
  clean_detection: true
  clean_bypass: false

# Phase 6: Fast Startup Mode
fast_startup:
  enable: true
  startup_frames: 50
  alpha_noise_startup: 0.7
  alpha_xi_startup: 0.7
  alpha_g_startup: 0.4
  num_init_frames_fast: 10

# Phase 6: Transition Detection (禁用)
transition_detection:
  enable: false
