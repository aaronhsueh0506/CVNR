version: 1
name: Spectral Subtraction
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning
noise_estimation:
  method: simple_average
  num_init_frames: 20
gain_calculation:
  method: spectral_subtraction
  alpha: 2.5
  beta: 0.01
  alpha_smooth: 0.75
snr_adaptive:
  enable: true
  base_g_min_db: -12.0
  snr_smoothing: 0.9
  clean_detection: true
  clean_bypass: false
