version: 3
name: MMSE-STSA
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning
noise_estimation:
  method: recursive_average
  alpha: 0.95
  num_init_frames: 20
  update_during_speech: false
spp:
  alpha_xi: 0.96
  q: 0.6
  xi_min_db: -25.0
gain_calculation:
  method: spp_mmse
  g_min_db: -12.0
  alpha_g: 0.75
  use_full_formula: false
noise_tracking:
  enable: true
snr_adaptive:
  enable: true
  base_g_min_db: -12.0
  snr_smoothing: 0.9
  clean_detection: true
  clean_bypass: false
