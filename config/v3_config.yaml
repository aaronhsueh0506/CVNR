version: 3
name: MMSE-STSA
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning
noise_estimation:
  method: mcra              # v2.2: 改用 MCRA 噪聲估計
  alpha_s: 0.8              # 時間平滑因子
  alpha_d: 0.95              # 噪聲更新基礎速率
  alpha_p: 0.2              # SPP 平滑因子
  L: 120                     # 最小值窗口長度
  delta_db: 5.0             # 偏差補償
  num_init_frames: 20       # 初始噪聲估計幀數
spp:
  alpha_xi: 0.90          # Optuna 500-trial (2026-01-12)
  q: 0.40                 # Optuna 500-trial (2026-01-12)
  xi_min_db: -22.0        # Optuna 500-trial (2026-01-12)
gain_calculation:
  method: spp_mmse
  g_min_db: -19.5         # Optuna 500-trial (2026-01-12)
  alpha_g: 0.65           # Optuna 500-trial (2026-01-12)
  use_full_formula: true
noise_tracking:
  enable: true