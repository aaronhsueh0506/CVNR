version: 3
name: MMSE-STSA
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning
noise_estimation:
  method: recursive_average # v2.1: 改回 recursive_average + SPP 軟判決
  alpha: 0.95               # 噪聲更新速率
  num_init_frames: 20
spp:
  alpha_xi: 0.96          # v2.12: 調優結果
  q: 0.5                  # v2.12: 調優結果 (原 0.6)
  xi_min_db: -25.0
gain_calculation:
  method: spp_mmse
  g_min_db: -15.0         # v2.12: 調優結果 (原 -12.0)
  alpha_g: 0.6            # v2.12: 調優結果 (原 0.75)
  use_full_formula: false
noise_tracking:
  enable: true
