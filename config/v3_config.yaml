version: 3
name: MMSE-STSA
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning
noise_estimation:
  method: mcra              # v2.2: 改用 MCRA 噪聲估計
  alpha_s: 0.8              # 時間平滑因子
  alpha_d: 0.95             # 噪聲更新基礎速率
  alpha_p: 0.2              # SPP 平滑因子
  L: 125                     # 最小值窗口長度
  delta_db: 5.0             # 偏差補償
  num_init_frames: 10       # 初始噪聲估計幀數
spp:
  alpha_xi: 0.9           # Optuna 1000-trial (Score 0.5037)
  q: 0.35                 # Optuna 1000-trial
  xi_min_db: -25.0        # Optuna 1000-trial
gain_calculation:
  method: spp_mmse
  g_min_db: -17.0         # Optuna 1000-trial
  alpha_g: 0.80           # Optuna 1000-trial
  use_full_formula: true
noise_tracking:
  enable: true
