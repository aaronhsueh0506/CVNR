version: 3
name: MMSE-STSA
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning
noise_estimation:
  method: mcra              # v2.2: 改用 MCRA 噪聲估計
  alpha_s: 0.9              # 時間平滑因子
  alpha_d: 0.85             # 噪聲更新基礎速率
  alpha_p: 0.2              # SPP 平滑因子
  L: 96                     # 最小值窗口長度
  delta_db: 5.0             # 偏差補償
  num_init_frames: 10       # 初始噪聲估計幀數
spp:
  alpha_xi: 0.96          # v2.12: 調優結果
  q: 0.5                  # v2.12: 調優結果 (原 0.6)
  xi_min_db: -25.0
gain_calculation:
  method: spp_mmse
  g_min_db: -15.0         # v2.12: 調優結果 (原 -12.0)
  alpha_g: 0.6            # v2.12: 調優結果 (原 0.75)
  use_full_formula: false
noise_tracking:
  enable: true
