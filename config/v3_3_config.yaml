# V3-3: PMMSE (Perceptually Motivated MMSE)
#
# 增益計算: Wolfe & Godsill (2003) β=0.5 公式
#   G_PM = sqrt(v) / (sqrt(π) · γ) · 1 / i0e(v/2)
#   使用 scipy.special.i0e 避免數值溢出
#
# 噪聲估計方法: RecursiveAverage + Bayesian SPP 軟判決
#   - SppEstimator 計算語音存在機率
#   - 語音段自動降低噪聲更新速率
#
# ΔPESQ: +0.449 (Optuna 優化)

version: "3.3"
name: "PMMSE-Wolfe-Godsill"

audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning

noise_estimation:
  method: mcra              # v2.2: 改用 MCRA 噪聲估計
  alpha_s: 0.8              # 時間平滑因子
  alpha_d: 0.95             # 噪聲更新基礎速率
  alpha_p: 0.2              # SPP 平滑因子
  L: 125                     # 最小值窗口長度
  delta_db: 5.0             # 偏差補償
  num_init_frames: 10       # 初始噪聲估計幀數

spp:
  alpha_xi: 0.9           # Optuna 1000-trial (Score 0.5061)
  q: 0.5                  # Optuna 1000-trial
  xi_min_db: -19.0        # Optuna 1000-trial

gain_calculation:
  method: pmmse               # Wolfe & Godsill β=0.5 公式
  g_min_db: -18.0             # Optuna 1000-trial
  alpha_g: 0.80               # Optuna 1000-trial
  use_spp_weighting: true

noise_tracking:
  enable: true
