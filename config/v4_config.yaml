version: 4
name: IMCRA-OMLSA
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning
noise_estimation:
  method: imcra
  alpha_s: 0.90
  alpha_d: 0.88    # 優化值（從 0.92 修正）
  L: 120           # 優化值（從 100 修正）
  delta_db: 8.0
  num_init_frames: 20
spp:
  alpha_xi: 0.98
  q: 0.5
  xi_min_db: -25.0
gain_calculation:
  method: omlsa
  g_min_db: -20.0
  alpha_g: 0.88    # 優化值（從 0.7 修正）
  gamma_0: 4.6
noise_tracking:
  enable: false    # 暫時禁用以測試性能
snr_adaptive:
  enable: false    # 暫時禁用以測試性能
  base_g_min_db: -18.0
  snr_smoothing: 0.9
  clean_detection: true
  clean_bypass: false
