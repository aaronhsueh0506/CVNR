audio:
  fft_size: 512
  frame_shift_ms: 10
  frame_size_ms: 20
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  alpha_g: 0.85               # 調優結果（V3-2: 0.92）
  g_min_db: -12.5
  method: omlsa
  use_asymmetric_smoothing: true
  alpha_attack: 0.3
name: IMCRA-OMLSA
noise_estimation:
  method: imcra
  freq_smooth_width: 5         # 調優：更寬頻率平滑窗（穩態噪聲+VCTK平衡）
  alpha_s: 0.65                # 調優：較低平滑 → 更快追蹤噪聲變化
  alpha_d: 0.85                # 調優：IMCRA SPP 更準確，不需太低
  L: 48                        # 480ms 場景追蹤（同 V3-2）
  V: 8                         # 子窗口更新週期
  U: 6                         # 子窗口數量
  delta_db: 10.0               # 第一階段閾值
  delta_s_db: 3.5              # 調優：較高閾值 → 噪聲估計更積極追蹤
  num_init_frames: 20
soft_vad:
  enable: false
spp:
  alpha_xi: 0.95               # 調優：IMCRA 噪聲估計更乾淨，可用更高平滑
  q: 0.50
  xi_min_db: -20.0
version: 4
