# V4: IMCRA-OMLSA Configuration
# 基於 Cohen 2003 論文的正確實現

version: 4
name: "IMCRA-OMLSA"

# Audio Parameters
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: "hanning"

# IMCRA Noise Estimation (Cohen 2003)
# 兩階段結構：粗略 VAD + 精細估計
noise_estimation:
  method: "imcra"
  freq_smooth_width: 1       # 頻率平滑窗寬度（單側）
  alpha_s: 0.9               # 時間平滑因子（Cohen 推薦）
  alpha_d: 0.85              # 噪聲更新基礎速率（Cohen 推薦）
  L: 96                      # 最小值窗口長度（約 1 秒 @ 10ms）
  V: 15                      # 更新週期（幀）
  U: 8                       # 子窗口數量
  delta_db: 5.0              # 第一階段閾值 Γ_0
  delta_s_db: 3.0            # 第二階段閾值 Γ_1
  num_init_frames: 20

# SPP Estimation (Optuna 1000-trial, Score 0.5209)
spp:
  alpha_xi: 0.9              # Optuna 1000-trial
  q: 0.6                     # Optuna 1000-trial
  xi_min_db: -19.0           # Optuna 1000-trial

# OMLSA Gain Calculation
gain_calculation:
  method: "omlsa"
  g_min_db: -17.0            # Optuna 1000-trial
  alpha_g: 0.87              # Optuna 1000-trial
  gamma_0: 4.6               # SPP 閾值參數
  use_linear_spp_weighting: false

# Noise Scene Tracking (v1.5.0)
noise_tracking:
  enable: true

# Notes:
# IMCRA 兩階段處理流程（Cohen 2003）:
#
# 第一階段（粗略 VAD）:
#   1. 頻率平滑：S_f = Σ b(i) * |Y(k-i)|²（Hanning 窗）
#   2. 時間平滑：S = α_s * S + (1-α_s) * S_f
#   3. 最小值追蹤：每 V 幀更新，保留 U 個子窗口
#   4. 粗略語音指示：I(k) = 1 if S(k)/S_min(k) < Γ_0
#
# 第二階段（精細估計）:
#   5. 條件頻率平滑：只對非語音頻率平滑
#   6. 第二階段時間平滑和最小值追蹤
#   7. 精細 SPP：用於噪聲更新
#
# 噪聲更新:
#   8. 自適應平滑：α̃_d = α_d + (1-α_d) * p
#   9. 噪聲估計：λ_d = α̃_d * λ_d + (1-α̃_d) * |Y|²
#
# 參數調優建議:
# - 穩態噪聲：增大 alpha_d (0.90)，減小 L (80)
# - 非穩態噪聲：減小 alpha_d (0.80)，增大 L (120)
# - 更積極降噪：增大 delta_db (6.0)
# - 保留更多語音：減小 delta_db (4.0)
