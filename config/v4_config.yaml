audio:
  fft_size: 512
  frame_size: 512
  hop_size: 256
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  alpha_g: 0.88
  g_min_db: -15.0
  method: mmse_lsa
  use_asymmetric_smoothing: true
  alpha_attack: 0.3
  alpha_decay: null
  # V4: SPP-protected floor 保留介面，預設關閉（smoke test 顯示收益有限）
  # spp_protect_floor_db: -10.0
  # spp_protect_threshold: 0.5
name: OMLSA + Wind Handler (conservative)
noise_estimation:
  method: mcra
  alpha_s: 0.95
  alpha_d: 0.7
  alpha_p: 0.2
  L: 32
  delta_db: 10.0
  num_init_frames: 20
  broadband_threshold: 1.0
  scene_change_threshold_db: 10.0
  scene_change_min_frames: 5
  scene_change_blend: 0.5
  scene_change_flatness_threshold: 0.4
noise_tracking:
  enable: true
spp:
  alpha_xi: 0.88
  q: 0.50
  xi_min_db: -20.0
# V4 Wind Handler
#
# 設計檢討（依 smoke test / wind_synth 實驗結果）：
# - 原激進 adaptive profile（mild band_0 g_min=-25dB, severe=-35dB）在 VCTK 與
#   wind_synth 兩端都不如「保留 normal profile」；降 g_min 的同時也壓到語音
#   F1/F2 能量，PESQ 下降。
# - Transient suppressor 對無 buffeting 的一般場景反而輕微有害。
# - 保留 Detector/FreqAdaptive 框架，但 profile 預設 FLAT（所有 severity 都
#   等同 normal），供未來真正 buffeting 場景再 tune。
wind_handler:
  enable: true
  detector:
    low_freq_cutoff: 300.0
    high_freq_cutoff: 2000.0
    low_energy_ratio_threshold: 0.85
    low_energy_ratio_slope: 15.0
    spectral_tilt_threshold_db: 35.0
    spectral_tilt_slope: 0.3
    alpha_prob: 0.7
    hangover_frames: 15
    mild_threshold: 0.5
    severe_threshold: 0.85
  freq_adaptive:
    freq_band_edges: [0, 200, 800, 4000, 8000]
    # 預設 FLAT profile：所有 severity 等同 normal。
    # 未來若要重新啟用 adaptive suppression，只需把 mild/severe 位置改回 -18/-25 等值。
    g_min_profile_db:
      band_0: [-15, -15, -15]
      band_1: [-15, -15, -15]
      band_2: [-15, -15, -15]
      band_3: [-15, -15, -15]
    alpha_xi_profile:
      band_0: [0.88, 0.88, 0.88]
      band_1: [0.88, 0.88, 0.88]
      band_2: [0.88, 0.88, 0.88]
      band_3: [0.88, 0.88, 0.88]
    alpha_g_profile:
      band_0: [0.88, 0.88, 0.88]
      band_1: [0.88, 0.88, 0.88]
      band_2: [0.88, 0.88, 0.88]
      band_3: [0.88, 0.88, 0.88]
  transient_suppressor:
    enable: false
    short_window_ms: 10.0
    long_window_ms: 500.0
    threshold_db: 15.0
    suppression_db: -12.0
    attack_ms: 2.0
    release_ms: 20.0
    enable_highpass_prefilter: true
    highpass_cutoff_hz: 80.0
version: 4
