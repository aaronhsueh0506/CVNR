version: 3-4-v3-2-aligned
name: Laplacian-MMSE-V3-2-Aligned
# 對齊 V3-2 參數的 V3-4 配置

audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning

noise_estimation:
  method: recursive_average
  alpha: 0.95
  num_init_frames: 20
  update_during_speech: false

spp:
  alpha_xi: 0.96            # 同步 V3-3 最佳參數
  q: 0.5                    # 對齊 V3-2
  xi_min_db: -25.0

gain_calculation:
  method: laplacian_mmse
  g_min_db: -20.0           # 對齊 V3-2
  alpha_g: 0.7              # 對齊 V3-2

noise_tracking:
  enable: true

snr_adaptive:
  enable: true              # 對齊 V3-2（關鍵！）
  base_g_min_db: -12.0      # 對齊 V3-2
  snr_smoothing: 0.9
  clean_detection: true
  clean_bypass: false       # 對齊 V3-2
