# V3-4: OMLSA-MCRA (Cohen 2001-2003)
#
# 增益計算: OMLSA (Optimally Modified Log-Spectral Amplitude)
#   在對數域進行 SPP 加權: log(G) = p*log(G_mmse) + (1-p)*log(g_min)
#
# 噪聲估計方法: MCRA (含瞬態偵測 v2.6)
#   - 最小值控制遞歸平均
#   - 瞬態偵測: eta = 0.95 / (1 + e^(20*(beta-10)))
#
# 後處理: Human Voice Band Soft VAD (v2.6)
#   - 頻率範圍: 300Hz - 3400Hz
#   - 映射函數: 0.1 + 0.9 * (1 - e^(-3*mean_power))

version: "3.4"
name: "OMLSA-MCRA"

audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning

noise_estimation:
  method: mcra
  alpha_s: 0.9              # 時間平滑因子
  alpha_d: 0.85             # 噪聲更新基礎速率
  alpha_p: 0.2              # SPP 平滑因子
  L: 96                     # 最小值窗口長度（約 1 秒 @ 10ms 幀移）
  delta_db: 5.0             # 語音檢測閾值
  num_init_frames: 20       # 初始噪聲估計幀數

spp:
  alpha_xi: 0.98            # 先驗 SNR 平滑因子
  q: 0.5                    # 語音先驗機率
  xi_min_db: -25.0          # 先驗 SNR 下限

gain_calculation:
  method: omlsa             # OMLSA 增益計算
  g_min_db: -20.0           # 最小增益
  alpha_g: 0.7              # 增益時間平滑因子
  use_linear_spp_weighting: false  # false=對數域加權(推薦)

post_processing:
  enable_soft_vad: true     # Human Voice Band Soft VAD (v2.6)
