audio:
  fft_size: 512
  frame_shift_ms: 10
  frame_size_ms: 20
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  alpha_g: 0.6            # v2.12: 調優結果 (原 0.7)
  g_min_db: -12.0         # v2.12: 維持 -12.0
  method: mmse_lsa
  use_linear_spp_weighting: false
name: MMSE-LSA
noise_estimation:
  method: mcra              # v2.2: 改用 MCRA 噪聲估計
  alpha_s: 0.9              # 時間平滑因子
  alpha_d: 0.85             # 噪聲更新基礎速率
  alpha_p: 0.2              # SPP 平滑因子
  L: 96                     # 最小值窗口長度
  delta_db: 5.0             # 偏差補償
  num_init_frames: 10       # 初始噪聲估計幀數
noise_tracking:
  enable: true
spp:
  alpha_xi: 0.94          # v2.12: 調優結果 (原 0.96)
  q: 0.5                  # v2.12: 維持 0.5
  xi_min_db: -15.0        # v2.2: 從 -25 提升，防止增益過低
version: 3-2
