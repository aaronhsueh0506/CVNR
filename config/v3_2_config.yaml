audio:
  fft_size: 512
  frame_shift_ms: 10
  frame_size_ms: 20
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  alpha_g: 0.92
  g_min_db: -12.5
  method: mmse_lsa
name: MMSE-LSA
noise_estimation:
  method: mcra
  alpha_s: 0.95                # 調優：更高平滑 → 更穩定功率譜估計
  alpha_d: 0.7
  alpha_p: 0.2
  L: 32                        # 調優：320ms 更快場景追蹤（原 48/480ms）
  delta_db: 10.0
  num_init_frames: 20
  broadband_threshold: 1.0     # 調優：關閉（L=32 已足夠快速追蹤場景轉換）
noise_tracking:
  enable: true
soft_vad:
  enable: false
  method: flatness             # spp / flatness / energy_ratio
spp:
  alpha_xi: 0.88
  q: 0.50
  xi_min_db: -20.0
version: 3-2
