audio:
  fft_size: 512
  frame_shift_ms: 10
  frame_size_ms: 20
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  alpha_g: 0.80           # Optuna 500-trial (2026-01-12)
  g_min_db: -12.5         # Optuna 500-trial (2026-01-12)
  method: mmse_lsa
  use_linear_spp_weighting: false
name: MMSE-LSA
noise_estimation:
  method: mcra              # v2.2: 改用 MCRA 噪聲估計
  alpha_s: 0.8              # 時間平滑因子
  alpha_d: 0.95             # 噪聲更新基礎速率
  alpha_p: 0.2              # SPP 平滑因子
  L: 120                    # 最小值窗口長度
  delta_db: 5.0             # 偏差補償
  num_init_frames: 20       # 初始噪聲估計幀數
  # eta 場景轉換偵測
  # 當噪聲環境突然改變時（如從安靜變吵雜），加速噪聲估計更新
  # 穩定噪聲環境下不會觸發，可保持 enable_eta: false
  enable_eta: false         # 開關（測試顯示對 PESQ/STOI 影響極小，建議關閉以減少複雜度）
  eta_beta_threshold: 10.0  # 能量比閾值，β > threshold 時觸發
  eta_slope: 20.0           # sigmoid 斜率（>0: sigmoid 模式, =0: hard threshold 模式）
noise_tracking:
  enable: true
spp:
  alpha_xi: 0.92          # Optuna 500-trial (2026-01-12)
  q: 0.50                 # Optuna 500-trial (2026-01-12)
  xi_min_db: -20.0        # Optuna 500-trial (2026-01-12)        
version: 3-2
