audio:
  fft_size: 512
  frame_size: 512
  hop_size: 256
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  # NOTE: V3-2 runs ASYMMETRIC gain smoothing (attack=0.3 fast rise / decay=alpha_g slow fall)
  # via MmseLsaGainCalculator defaults. process_audio's V3-2 branch does NOT read
  # use_asymmetric_smoothing/alpha_attack/alpha_decay, so `alpha_g` below is the DECAY factor and
  # the fast attack (0.3) is fixed in code (not configurable here). The C port mirrors this.
  alpha_g: 0.88
  g_min_db: -30.0             # amplitude dB (/20); = old -15 @ /10 power-dB → same 0.0316 floor
  method: mmse_lsa
name: MMSE-LSA
noise_estimation:
  method: mcra
  alpha_s: 0.95                # 調優：更高平滑 → 更穩定功率譜估計
  alpha_d: 0.7
  alpha_p: 0.2
  L: 32                        # 最小值窗長 32 幀 × 16ms/hop = 512ms（原 48 幀 = 768ms；hop=256）
  delta_db: 10.0
  num_init_frames: 20
  broadband_threshold: 1.0     # 調優：關閉（L=32 已足夠快速追蹤場景轉換）
  scene_change_threshold_db: 10.0  # 場景轉換偵測：高頻段 γ > 10dB 且 flatness 高，連續 5 幀觸發
  scene_change_min_frames: 5
  scene_change_blend: 0.5
  scene_change_flatness_threshold: 0.4  # 高頻段 spectral flatness 閾值，避免語音誤觸發
noise_tracking:
  enable: true
spp:
  alpha_xi: 0.92                # 2026-07 musical-noise fix: DD ξ-smoothing lever (was 0.88). Damps
                                # ξ jitter → SPP jitter → the isolated gain peaks = musical noise.
                                # Shared across all strength presets (mild/balanced/aggressive) via
                                # core/nr_strength.py; C default_config mirrors this for parity.
  q: 0.50
  xi_min_db: -20.0
version: 3-2
