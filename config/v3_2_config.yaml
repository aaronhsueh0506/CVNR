audio:
  fft_size: 512
  frame_shift_ms: 10
  frame_size_ms: 20
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  alpha_g: 0.80
  g_min_db: -12.5
  method: mmse_lsa
  use_linear_spp_weighting: false
name: MMSE-LSA
noise_estimation:
  method: mcra
  alpha_s: 0.7              # v4.0: 0.8 → 0.7 (更快響應，測試證明無負面影響)
  alpha_d: 0.95             # 噪聲更新基礎速率（測試證明最佳）
  alpha_p: 0.2
  L: 5                      # v4.0: 120 → 5 (50ms 快速場景適應，測試證明無負面影響)
  delta_db: 5.0
  num_init_frames: 20
  # eta 場景轉換偵測
  # v4.0 測試結果: L=5 已提供快速場景適應（50ms），無需 eta
  # test_wav: enable_eta 降低 PESQ 0.06-0.41
  # VCTK: enable_eta 收益僅 0.006 PESQ（可忽略）
  enable_eta: false
  eta_beta_threshold: 10.0
  eta_slope: 20.0
noise_tracking:
  enable: true
spp:
  alpha_xi: 0.92
  q: 0.50
  xi_min_db: -20.0
version: 3-2
