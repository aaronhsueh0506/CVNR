audio:
  fft_size: 512
  frame_size: 512
  hop_size: 256
  sample_rate: 16000
  window_type: hanning
gain_calculation:
  # All strength presets share these temporal constants. Presets only change
  # suppression depth (q / xi_min / g_min / over-subtraction), so choosing a
  # stronger preset cannot silently switch to a faster noise tracker.
  alpha_g: 0.88
  alpha_attack: 0.15           # authored and validated on the 16 ms product grid
  g_min_db: -25.0
  noise_over_subtraction: 1.4
  # A frame-level speech decision protects weak LF harmonics that OM-LSA's
  # independent-bin prior would otherwise pull toward g_min.  The protected
  # band reuses noise_gate_lf_hz below; all strength presets share this guard.
  speech_protect_floor_db: -15.0
  speech_protect_threshold: 0.0
  # Authored at the balanced prior q=0.52; applied as value + (q - 0.52)
  # (C: MMSE_LSA_SPEECH_PROTECT_ANCHOR_Q).
  speech_protect_frame_threshold: 0.55
  # The frame make-up experiment (makeup_gain / makeup_prior / makeup_blim /
  # makeup_up_slope / makeup_down_slope) stays off and is driven from the
  # research CLI (tools/run_vctk_benchmark.py), not from this file.
  method: mmse_lsa
name: MMSE-LSA
noise_estimation:
  method: mcra
  alpha_s: 0.95                # 調優：更高平滑 → 更穩定功率譜估計
  alpha_d: 0.903414             # 2026-09-03 retune (C3): = 0.85 on the 16 ms grid (0.85^(10/16),
                                # authored here in the legacy 10 ms domain like its siblings).
                                # Was 0.7 (= 0.565 at 16 ms): that fast tracking is what hurt speech at
                                # balanced -- 824-case VCTK+DEMAND STOI 0.868 -> 0.880, SI-SDR 10.84 -> 11.48,
                                # segSNR 5.00 -> 5.36, PESQ 2.431 -> 2.448 (all four improve).
  alpha_p: 0.2
  L: 32                        # 最小值窗長 32 幀 × 16ms/hop = 512ms（原 48 幀 = 768ms；hop=256）
  delta_db: 10.0
  num_init_frames: 20
  broadband_threshold: 1.0     # 調優：關閉（L=32 已足夠快速追蹤場景轉換）
  scene_change_threshold_db: 10.0  # 場景轉換偵測：高頻段 γ > 10dB 且 flatness 高，連續 5 幀觸發
  scene_change_min_frames: 5
  scene_change_blend: 0.5
  scene_change_flatness_threshold: 0.4  # 高頻段 spectral flatness 閾值，避免語音誤觸發
  # When speech is established elsewhere in the frame, prevent speech energy
  # below 300 Hz from ratcheting the MCRA floor upward. Only the rising
  # direction is slowed; falling/noise-only updates retain the normal rate.
  alpha_d_speech: 0.95
  noise_gate_xi_db: 3.0
  noise_gate_lf_hz: 300.0
  noise_gate_frame_frac: 0.50
noise_tracking:
  enable: true
spp:
  alpha_xi: 0.92                # 2026-07 musical-noise fix: DD ξ-smoothing lever (was 0.88). Damps
                                # ξ jitter → SPP jitter → the isolated gain peaks = musical noise.
                                # Shared across all strength presets (mild/balanced/aggressive) via
                                # core/nr_strength.py; C default_config mirrors this for parity.
  q: 0.52
  xi_min_db: -10.0
  # Optional Cohen eq.18 experiment. It is disabled in the product path: the
  # corpus sweep did not justify changing the validated DD recursion.
  dd_from_gmmse: false
version: 3-2
