version: 3-4-balanced
name: Laplacian-MMSE-Balanced
audio:
  sample_rate: 16000
  frame_size_ms: 20
  frame_shift_ms: 10
  fft_size: 512
  window_type: hanning
noise_estimation:
  method: recursive_average
  alpha: 0.95
  num_init_frames: 20
  update_during_speech: false
spp:
  alpha_xi: 0.95          # ✅ 0.98 → 0.95 (折中響應速度)
  q: 0.6                  # ✅ 0.5 → 0.6 (更保守的語音檢測)
  xi_min_db: -25.0
gain_calculation:
  method: laplacian_mmse
  g_min_db: -20.0         # 保持，由 SNR adaptive 動態調整
  alpha_g: 0.5            # ✅ 0.7 → 0.5 (適度降低平滑)
  beta_laplacian: 1.3     # ✅ 1.5 → 1.3 (降低保守性)
noise_tracking:
  enable: true
snr_adaptive:
  enable: true            # ✅ false → true (啟用 SNR 自適應)
  base_g_min_db: -12.0    # ✅ -15.0 → -12.0 (折中抑制程度)
  snr_smoothing: 0.9
  clean_detection: true
  clean_bypass: false
